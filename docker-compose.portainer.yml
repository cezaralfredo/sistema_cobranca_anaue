# =============================================================================
# Sistema de Cobranca Anaue - docker-compose (Portainer + Evolution API + PostgreSQL dedicado)
# =============================================================================
# Stack: sistema_cobranca
# Banco: PostgreSQL DEDICADO e isolado nesta stack (servico `postgres`, volume
#        proprio, credenciais proprias) - nao compartilha nada com outros sistemas.
#
# Redes externas partilhadas:
#   - app_network .......... rede da Evolution API (evolution-api:8080) e Evo CRM
#   - nginx-proxy_default .. rede do Nginx Proxy Manager (p/ expor dashboard via dominio)
#
# Servicos: postgres | app (dashboard) | scheduler (regua diaria)
# =============================================================================
# CREDENCIAIS (definir na aba "Environment variables" da Stack no Portainer):
#   POSTGRES_PASSWORD  -> senha do banco dedicado (gerar ao criar a stack)
#   WHATSAPP_API_KEY   -> token da instancia OU AUTHENTICATION_API_KEY da Evolution
#   EMAIL_USER/EMAIL_PASS -> SMTP
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # PostgreSQL - DEDICADO e ISOLADO
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: anaue-cobranca-postgres
    environment:
      POSTGRES_USER: anaue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD na Stack}
      POSTGRES_DB: sistema_cobranca
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed (schema + clientes) aplicado apenas na PRIMEIRA inicializacao
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - cobranca_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anaue -d sistema_cobranca"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ===========================================================================
  # Dashboard Web (Flask)
  # ===========================================================================
  app:
    build: .
    container_name: anaue-cobranca-app
    command: dashboard
    ports:
      - "5000:5000"
    environment: &app_env
      # Banco (dedicado da stack)
      DATABASE_URL: ${DATABASE_URL:-postgresql://anaue:${POSTGRES_PASSWORD}@postgres:5432/sistema_cobranca}
      # --- Evolution API (v2) ---
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-http://evolution-api:8080}
      WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-anaue}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:?Defina WHATSAPP_API_KEY na Stack}
      WHATSAPP_DELAY_MIN: ${WHATSAPP_DELAY_MIN:-10}
      WHATSAPP_DELAY_MAX: ${WHATSAPP_DELAY_MAX:-30}
      WHATSAPP_TIMEOUT: ${WHATSAPP_TIMEOUT:-30}
      WHATSAPP_RETRIES: ${WHATSAPP_RETRIES:-3}
      # --- SMTP (E-mail) ---
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      EMAIL_USER: ${EMAIL_USER:?Defina EMAIL_USER na Stack}
      EMAIL_PASS: ${EMAIL_PASS:?Defina EMAIL_PASS na Stack}
    volumes:
      - static_data:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cobranca_network
      - app_network
      - npm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # Agendador diario (regua de cobranca) - python interno, sem docker socket
  # ===========================================================================
  scheduler:
    build: .
    container_name: anaue-cobranca-scheduler
    command: scheduler
    environment:
      <<: *app_env
      CRON_HOUR: ${CRON_HOUR:-9}
      CRON_MINUTE: ${CRON_MINUTE:-0}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - static_data:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cobranca_network
      - app_network

# =============================================================================
# Volumes (nomeados - nao depende de caminho no host)
# =============================================================================
volumes:
  pgdata:
  static_data:
    name: anaue-cobranca-static

# =============================================================================
# Redes
# =============================================================================
networks:
  cobranca_network:
    driver: bridge
  # Redes externas existentes no host (evolution-api + NPM)
  app_network:
    external: true
  npm:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy_default}